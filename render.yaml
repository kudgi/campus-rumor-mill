services:
  - type: web
    name: campus-rumor-mill
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-rumor-mill-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
databases:
  - name: campus-rumor-mill-db
