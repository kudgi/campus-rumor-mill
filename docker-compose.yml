services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus_rumor_mill
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes: [campus-rumor-mill-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d campus_rumor_mill']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/campus_rumor_mill
      PORT: 3000
      CORS_ORIGIN: http://localhost:3000
      SESSION_SECRET: local-development-secret-change-me
      ADMIN_API_KEY: local-admin-key-change-me
      COOKIE_SECURE: 'false'
volumes:
  campus-rumor-mill-data:
